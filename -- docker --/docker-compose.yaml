name: "microservices"

services:
  account-ws:
    image: "localhost:8002/accounts:${VERSION}"
    container_name: "account-ws"
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          # max memory used by application
          memory: 700m
    networks:
      - bankAppNetwork

  cards-ws:
    image: "localhost:8002/cards:${VERSION}"
    container_name: "cards-ws"
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          # max memory used by application
          memory: 700m
    networks:
      - bankAppNetwork

  loans-ws:
    image: "localhost:8002/loans:${VERSION}"
    container_name: "loans-ws"
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          # max memory used by application
          memory: 700m
    networks:
      - bankAppNetwork

networks:
  bankAppNetwork:
    driver: "bridge"